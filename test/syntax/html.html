<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Manager App</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            input,
            button {
                margin: 5px;
            }
            .user-card {
                border: 1px solid #ccc;
                padding: 10px;
                margin: 5px 0;
            }
            .admin {
                background-color: #f0f8ff;
            }
        </style>
    </head>
    <body>
        <h1>User Manager App</h1>

        <div>
            <input type="text" id="userName" placeholder="Enter name" />
            <input type="number" id="userAge" placeholder="Enter age" />
            <button id="addUserBtn">Add User</button>
        </div>

        <h2>Users:</h2>
        <div id="userList"></div>

        <script>
            // ---------- Classes ----------
            class User {
                constructor(name, age) {
                    this.name = name;
                    this.age = age;
                    this.roles = ["user"];
                }

                addRole(role) {
                    this.roles.push(role);
                }

                greet() {
                    return `Hello, ${this.name}`;
                }
            }

            class UserService {
                constructor() {
                    this.users = [];
                }

                addUser(user) {
                    this.users.push(user);
                }

                getAllUsers() {
                    return this.users;
                }

                count() {
                    return this.users.length;
                }
            }

            // ---------- App Logic ----------
            const userService = new UserService();

            const userListDiv = document.getElementById("userList");
            const addUserBtn = document.getElementById("addUserBtn");

            function renderUsers() {
                userListDiv.innerHTML = "";
                userService.getAllUsers().forEach((user) => {
                    const userDiv = document.createElement("div");
                    userDiv.className = "user-card";
                    if (user.roles.includes("admin"))
                        userDiv.classList.add("admin");
                    userDiv.innerHTML = `
                        <strong>${user.name}</strong> (Age: ${user.age})<br>
                        Roles: ${user.roles.join(", ")}<br>
                        ${user.greet()}
                    `;
                    userListDiv.appendChild(userDiv);
                });
            }

            addUserBtn.addEventListener("click", () => {
                const nameInput = document.getElementById("userName");
                const ageInput = document.getElementById("userAge");

                const name = nameInput.value.trim();
                const age = parseInt(ageInput.value);

                if (!name || isNaN(age)) {
                    alert("Please enter valid name and age");
                    return;
                }

                const newUser = new User(name, age);

                // Example conditional: make first user admin
                if (userService.count() === 0) newUser.addRole("admin");

                userService.addUser(newUser);
                renderUsers();

                nameInput.value = "";
                ageInput.value = "";
            });

            // ---------- Example Data ----------
            const defaultUser = new User("Madhan", 25);
            defaultUser.addRole("admin");
            userService.addUser(defaultUser);
            renderUsers();
        </script>
    </body>
</html>
